<!DOCTYPE html>
<html>
<head>
  <title>Carbon Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 80px;
      background-color: #f4f4f4;
      transition: background-color 0.5s, color 0.5s;
    }

    .dark-mode {
      background-color: #1b1b1b;
      color: white;
    }

    .dark-mode input,
    .dark-mode select {
      background-color: #222;
      color: white;
      border: 1px solid white;
    }

    input, select, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }

    button:hover {
      background-color: #45a049;
    }

    #result {
      font-size: 20px;
      margin-top: 20px;
      font-weight: bold;
      white-space: pre-line;
    }

    #co2Chart {
      max-width: 500px;
      margin: 30px auto;
    }
  </style>
</head>

<body>

  <h2>🌿 Carbon Footprint Calculator</h2>

  <input id="km" type="number" placeholder="Enter km travelled">

  <br>

  <select id="type">
    <option value="0.21">🚗 Car</option>
    <option value="0.12">🏍️ Bike</option>
    <option value="0.05">🚆 Train</option>
    <option value="0.08">🚌 Bus</option>
    <option value="0.35">✈️ Airplane</option>
  </select>

  <br>

  <input id="units" type="number" placeholder="Electricity units (kWh)">

  <br>

  <button onclick="calculate()">Calculate</button>
  <button onclick="darkMode()">🌙 Dark Mode</button>
  <button onclick="resetApp()">Reset</button>
  <button onclick="copyResult()">Copy Result</button>

  <p id="result"></p>

  <canvas id="co2Chart"></canvas>

  <script>
    function darkMode() {
      document.body.classList.toggle("dark-mode");
    }

    function calculate() {
      let km = document.getElementById("km").value;
      let factor = document.getElementById("type").value;
      let units = document.getElementById("units").value || 0;

      if (!km || km <= 0) {
        document.getElementById("result").innerText = "Enter valid distance!";
        return;
      }

      let travelCO2 = km * factor;
      let electricityCO2 = units * 0.82;
      let total = travelCO2 + electricityCO2;

      let message = "";

      if (total < 10) {
        message = "🌱 Low emission";
      } else if (total < 25) {
        message = "⚠️ Moderate emission";
      } else if (total < 40) {
        message = "🔴 High emission";
      } else {
        message = "🚨 Very high emission";
      }

      let travelPct = (travelCO2 / total) * 100;
      let elecPct = (electricityCO2 / total) * 100;

      let resultBox = document.getElementById("result");

      resultBox.innerText =
        "Travel CO₂: " + travelCO2.toFixed(2) + " kg\n" +
        "Electricity CO₂: " + electricityCO2.toFixed(2) + " kg\n" +
        "Total: " + total.toFixed(2) + " kg → " + message + "\n\n" +
        "Breakdown → Travel: " + travelPct.toFixed(0) +
        "% | Electricity: " + elecPct.toFixed(0) + "%";

      if (total < 10) {
        resultBox.style.color = "green";
      } else if (total < 25) {
        resultBox.style.color = "orange";
      } else {
        resultBox.style.color = "red";
      }

      localStorage.setItem("lastResult", resultBox.innerText);

      let ctx = document.getElementById("co2Chart");

      if (window.myChart) {
        window.myChart.destroy();
      }

      window.myChart = new Chart(ctx, {
        type: "bar",
        data: {
          labels: ["Travel CO₂", "Electricity CO₂"],
          datasets: [{
            label: "Carbon Emission (kg)",
            data: [travelCO2, electricityCO2],
            borderWidth: 1
          }]
        },
        options: {
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    }

    function resetApp() {
      document.getElementById("km").value = "";
      document.getElementById("units").value = "";
      document.getElementById("result").innerText = "";

      if (window.myChart) {
        window.myChart.destroy();
      }

      localStorage.removeItem("lastResult");
    }

    function copyResult() {
      let text = document.getElementById("result").innerText;
      navigator.clipboard.writeText(text);
      alert("Result copied!");
    }

    window.onload = function () {
      let last = localStorage.getItem("lastResult");

      if (last) {
        document.getElementById("result").innerText = last;
      }
    };
  </script>

</body>
</html>
