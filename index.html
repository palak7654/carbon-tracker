<!DOCTYPE html>
<html>
<head>
  <title>Carbon Tracker</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 80px;
      background-color: #f4f4f4;
    }

    input, select, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
    }

    button:hover {
      background-color: #45a049;
    }

    #result {
      font-size: 20px;
      margin-top: 20px;
      font-weight: bold;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <h2>🌿 Carbon Footprint Calculator</h2>

  <input id="km" type="number" placeholder="Enter km travelled">

  <br>

  <select id="type">
    <option value="0.21">🚗 Car</option>
    <option value="0.12">🏍️ Bike</option>
    <option value="0.05">🚆 Train</option>
  </select>

  <br>

  <input id="units" type="number" placeholder="Electricity units (kWh)">

  <br>

  <button onclick="calculate()">Calculate</button>

  <p id="result"></p>

  <script>
    function calculate() {
      let km = document.getElementById("km").value;
      let factor = document.getElementById("type").value;
      let units = document.getElementById("units").value || 0;

      if (!km || km <= 0) {
        document.getElementById("result").innerText = "Enter valid distance!";
        return;
      }

      let travelCO2 = km * factor;
      let electricityCO2 = units * 0.82;
      let total = travelCO2 + electricityCO2;

      let message = "";

      if (total < 5) {
        message = "🌱 Low emission";
      } else if (total < 15) {
        message = "⚠️ Moderate emission";
      } else {
        message = "🔴 High emission";
      }

      let resultBox = document.getElementById("result");

      resultBox.innerText =
        "Travel CO₂: " + travelCO2.toFixed(2) + " kg\n" +
        "Electricity CO₂: " + electricityCO2.toFixed(2) + " kg\n" +
        "Total: " + total.toFixed(2) + " kg → " + message;

      // color change
      if (total < 5) resultBox.style.color = "green";
      else if (total < 15) resultBox.style.color = "orange";
      else resultBox.style.color = "red";

      // save last result
      localStorage.setItem("lastResult", total.toFixed(2));
    }

    // show last result on reload
    window.onload = function () {
      let last = localStorage.getItem("lastResult");
      if (last) {
        document.getElementById("result").innerText =
          "Last total CO₂: " + last + " kg";
      }
    };
  </script>

</body>
</html>
